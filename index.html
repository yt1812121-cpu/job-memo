<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>秋招备忘录</title>
  <meta name="description" content="可离线使用、可导入导出的秋招任务备忘录" />
  <style>
    :root{--bg:#f6f7fb;--panel:#fff;--ink:#191b17;--muted:#74786f;--line:#e5e8df;--brand:#c7ff22;--brand-deep:#678d00;--brand-soft:#f2ffd1;--danger:#d6374a;--danger-soft:#fff0f2;--shadow:0 14px 45px rgba(30,35,60,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:920px;margin:auto;padding:32px 20px 70px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{color:var(--brand-deep);font-size:14px;font-weight:800}.title{font-size:30px;line-height:1.2;margin:5px 0 3px}.sub{color:var(--muted);font-size:14px}
    .actions,.filters{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)}.btn:hover{border-color:#aeb4a4}.btn.primary{background:var(--brand);border-color:#b8ef16;color:#111;font-weight:800}.btn.danger{color:var(--danger)}
    .quick{background:#171914;border:1px solid #292c25;border-radius:20px;padding:15px;margin-bottom:18px;box-shadow:var(--shadow)}.quick-row{display:flex;align-items:center;gap:10px}.quick-input{flex:1;min-width:0;border:0;background:transparent;color:#fff;padding:9px 4px;outline:0;font-size:16px}.quick-input::placeholder{color:#969b8e}.quick-add{flex:0 0 auto;border:0;border-radius:12px;background:var(--brand);color:#111;min-height:43px;padding:0 17px;font-weight:800}.parse-preview{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:25px;margin-top:8px;color:#aeb3a6;font-size:13px}.parse-chip{background:#2b2f25;border:1px solid #3e4535;color:#e7ebdf;border-radius:999px;padding:2px 9px}.parse-chip.auto{color:var(--brand);border-color:#506021}.quick-help{margin-left:auto;color:#7f8478;font-size:12px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.filter[aria-pressed=true]{background:var(--brand-soft);border-color:#b8e849;color:#3c5400;font-weight:800}
    .summary{color:var(--muted);font-size:14px;white-space:nowrap}.list{display:grid;gap:12px}.empty{border:1px dashed #cfd1da;border-radius:18px;padding:50px 20px;text-align:center;color:var(--muted)}
    .card{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px 18px;box-shadow:0 3px 14px rgba(30,35,60,.035)}.card.today{border-color:#b6e940;background:linear-gradient(90deg,var(--brand-soft),#fff 46%)}.card.conflict{border-color:#f1a2ad;background:linear-gradient(90deg,var(--danger-soft),#fff 46%)}.card.today.conflict{border-color:#f1a2ad;background:linear-gradient(90deg,var(--danger-soft),#fff 46%)}.check{margin-top:2px;width:24px;height:24px;flex:0 0 24px;border:2px solid #c6c8d0;border-radius:50%;background:#fff}.done .check{background:var(--brand);border-color:#aadb12;position:relative}.done .check:after{content:"✓";position:absolute;inset:-2px 0 0;color:#151713;font-size:15px;font-weight:900}.open{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.name{font-weight:720;font-size:17px}.badge{padding:2px 9px;border-radius:999px;background:#f0f1f5;color:#636772;font-size:12px}.today-tag{padding:2px 9px;border-radius:999px;background:var(--brand);color:#263500;font-size:12px;font-weight:800}.conflict-tag{padding:2px 9px;border-radius:999px;background:#ffe0e4;color:var(--danger);font-size:12px;font-weight:800}.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:7px}.note{color:#555963;font-size:14px;margin-top:7px}.done .name,.done .meta,.done .note{text-decoration:line-through;opacity:.5}
    dialog{width:min(600px,calc(100% - 28px));border:0;border-radius:22px;padding:0;box-shadow:var(--shadow)}dialog::backdrop{background:rgba(24,26,35,.45)}dialog.fallback{display:block;position:fixed;z-index:999;left:50%;top:50%;transform:translate(-50%,-50%);max-height:92vh;overflow:auto}.modal{padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal h2{font-size:21px;margin:0}.icon{border:0;background:#f3f4f7;border-radius:10px;width:40px;height:40px;font-size:20px}.form{display:grid;gap:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}label span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field{width:100%;border:1px solid #dfe1e8;border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink);outline:0}.field:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}textarea{resize:vertical;min-height:88px}.modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:5px}.right{display:flex;gap:8px}
    .foot{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:13px}.file{display:none}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#23252c;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:650px){.app{padding:22px 14px 55px}header{align-items:flex-start;flex-direction:column}.title{font-size:26px}.quick-row{align-items:stretch}.quick-add{padding:0 13px}.quick-help{display:none}.toolbar{align-items:flex-start;flex-direction:column}.summary{white-space:normal}.two{grid-template-columns:1fr}.card{padding:15px}.foot{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main class="app">
  <header><div><div class="eyebrow">秋招安排</div><h1 class="title">任务备忘录</h1><div class="sub">数据只保存在当前浏览器，可随时导出备份或转给朋友。</div></div><div class="actions"><button class="btn" id="importBtn">导入</button><button class="btn" id="exportBtn">导出</button><button class="btn primary" id="addBtn">＋ 新建</button></div></header>
  <section class="quick" aria-label="快速添加任务"><div class="quick-row"><input id="quickInput" class="quick-input" autocomplete="off" placeholder="直接记：明天下午3点 美团面试，立言厅"><button id="quickAdd" class="quick-add">记下来</button></div><div class="parse-preview" id="parsePreview"><span>输入后自动识别日期、时间和类型</span><span class="quick-help">回车保存</span></div></section>
  <section class="toolbar"><div class="filters" id="filters"><button class="btn filter" data-filter="all" aria-pressed="true">全部</button><button class="btn filter" data-filter="测评">测评</button><button class="btn filter" data-filter="笔试">笔试</button><button class="btn filter" data-filter="面试">面试</button><button class="btn filter" data-filter="done">已完成</button></div><div class="summary" id="summary"></div></section>
  <section class="list" id="list" aria-live="polite"></section>
  <div class="foot"><span>相同日期和时间的未完成任务会自动标红。</span><button class="btn" id="resetBtn">恢复示例任务</button></div>
</main>
<dialog id="editor"><div class="modal"><div class="modal-head"><h2 id="modalTitle">新建任务</h2><button class="icon" id="closeBtn" aria-label="关闭">×</button></div><form class="form" id="form">
  <label><span>公司 / 事项</span><input class="field" id="name" maxlength="60" required placeholder="例如：京东测评"></label>
  <div class="two"><label><span>类型</span><select class="field" id="type"><option>测评</option><option>笔试</option><option>面试</option><option>其他</option></select></label><label><span>日期</span><input class="field" id="date" type="date" required></label></div>
  <div class="two"><label><span>时间</span><input class="field" id="time" type="time"></label><label><span>时间性质</span><select class="field" id="timeMode"><option value="fixed">固定时间</option><option value="deadline">截止时间</option></select></label></div>
  <label><span>状态</span><select class="field" id="status"><option value="todo">待完成</option><option value="done">已完成</option></select></label>
  <label><span>备注</span><textarea class="field" id="note" maxlength="240" placeholder="地点、截止时间、需要准备的内容……"></textarea></label>
  <div class="modal-actions"><button type="button" class="btn danger" id="deleteBtn">删除</button><div class="right"><button type="button" class="btn" id="cancelBtn">取消</button><button type="submit" class="btn primary">保存</button></div></div>
  </form></div></dialog>
<input class="file" id="fileInput" type="file" accept="application/json,.json"><div class="toast" id="toast" role="status"></div>
<script>
const KEY='job-memo-v2';
const seed=[
 {id:1,name:'京东测评 ×2',type:'测评',date:'2026-09-20',time:'12:00',timeMode:'deadline',note:'中午前完成两个',status:'todo'},
 {id:2,name:'联想测评',type:'测评',date:'2026-09-21',time:'12:00',timeMode:'deadline',note:'中午前',status:'todo'},
 {id:3,name:'广汽测评',type:'测评',date:'2026-10-03',time:'',timeMode:'deadline',note:'10月3日前完成',status:'todo'},
 {id:4,name:'美团笔试',type:'笔试',date:'2026-09-19',time:'15:00',timeMode:'fixed',note:'与安克面试时间有重叠，需确认能否错峰',status:'todo'},
 {id:5,name:'联想笔试',type:'笔试',date:'2026-09-21',time:'12:00',timeMode:'deadline',note:'中午前',status:'todo'},
 {id:6,name:'蓝色光标笔试',type:'笔试',date:'2026-09-21',time:'12:00',timeMode:'deadline',note:'中午前，包含 AI 面试',status:'todo'},
 {id:7,name:'波克笔试',type:'笔试',date:'2026-09-22',time:'19:00',timeMode:'fixed',note:'与拼多多笔试撞时间',status:'todo'},
 {id:8,name:'拼多多笔试',type:'笔试',date:'2026-09-22',time:'19:00',timeMode:'fixed',note:'与波克笔试撞时间',status:'todo'},
 {id:9,name:'安克面试',type:'面试',date:'2026-09-19',time:'13:30',timeMode:'fixed',note:'13:30–15:30，立言厅',status:'todo'},
 {id:10,name:'网易互娱面试',type:'面试',date:'2026-09-19',time:'',timeMode:'fixed',note:'具体时间待补',status:'todo'},
 {id:11,name:'携程 AI 面试',type:'面试',date:'2026-09-21',time:'12:00',timeMode:'deadline',note:'中午前完成',status:'todo'}];
let tasks=load(),filter='all',editing=null;
const $=s=>document.querySelector(s), list=$('#list'),editor=$('#editor'),form=$('#form');
function cloneSeed(){return JSON.parse(JSON.stringify(seed))}
function normalizeTasks(items){return items.map(function(t){const deadline=t.timeMode==='deadline'||(!t.timeMode&&/中午前|截止|前完成/.test((t.note||'')+(t.name||'')));return Object.assign({},t,{timeMode:deadline?'deadline':'fixed'})})}
function encodeState(value){return btoa(unescape(encodeURIComponent(JSON.stringify(value)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeState(value){const base=value.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(base+'='.repeat((4-base.length%4)%4)))))}
function load(){try{const encoded=new URLSearchParams(location.hash.slice(1)).get('tasks');if(encoded){const x=decodeState(encoded);if(Array.isArray(x))return normalizeTasks(x)}}catch{}try{const x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x))return normalizeTasks(x)}catch{}return cloneSeed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch{}try{const u=new URL(location.href);u.hash='tasks='+encodeState(tasks);history.replaceState(null,'',u.href)}catch{try{location.hash='tasks='+encodeState(tasks)}catch{}}render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localDate(offset=0){const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseQuick(raw){
  const now=new Date(), text=raw.trim();let date=localDate(),time='',type='其他',note='',timeMode=/截止|ddl|DDL|前(?:完成)?/.test(text)?'deadline':'fixed';
  if(/后天/.test(text))date=localDate(2);else if(/明天|明日/.test(text))date=localDate(1);else if(/今天|今日/.test(text))date=localDate();
  let m=text.match(/(20\d{2})[年\/.\-](\d{1,2})[月\/.\-](\d{1,2})日?/);if(m)date=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;else{m=text.match(/(\d{1,2})月(\d{1,2})日?/);if(m){let y=now.getFullYear(),candidate=new Date(y,Number(m[1])-1,Number(m[2]));if(candidate<new Date(now.getFullYear(),now.getMonth(),now.getDate()-30))y++;date=`${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`}}
  m=text.match(/(?:上午|早上|中午|下午|晚上)?\s*(\d{1,2})(?::|：)(\d{2})/);if(m){let h=Number(m[1]);const prefix=m[0];if(/下午|晚上/.test(prefix)&&h<12)h+=12;if(/中午/.test(prefix)&&h<11)h+=12;time=`${String(h).padStart(2,'0')}:${m[2]}`}else{m=text.match(/(上午|早上|中午|下午|晚上)?\s*(\d{1,2})点(半|\d{1,2}分?)?/);if(m){let h=Number(m[2]),min=m[3]==='半'?30:parseInt(m[3])||0;if(/下午|晚上/.test(m[1]||'')&&h<12)h+=12;if(m[1]==='中午'&&h<11)h+=12;time=`${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`}}
  if(/面试/.test(text))type='面试';else if(/笔试/.test(text))type='笔试';else if(/测评|测验/.test(text))type='测评';
  const segments=text.split(/[，,；;]/).map(s=>s.trim()).filter(Boolean);let main=segments[0]||text;if(segments.length>1)note=segments.slice(1).join('；');
  let name=main.replace(/(20\d{2})[年\/.\-]\d{1,2}[月\/.\-]\d{1,2}日?|\d{1,2}月\d{1,2}日?|今天|今日|明天|明日|后天/g,'').replace(/(?:上午|早上|中午|下午|晚上)?\s*\d{1,2}(?:(?::|：)\d{2}|点(?:半|\d{1,2}分?)?)/g,'').replace(/截止|开始|参加|完成|ddl|DDL|前/g,'').replace(/^\s*[·\-—:：]+|\s+/g,' ').trim();
  if(!name)name=text;return{name,type,date,time,timeMode,note,status:'todo'}
}
function conflicts(){const groups={},ids=[];tasks.filter(function(t){return t.status!=='done'&&t.time&&t.timeMode!=='deadline'}).forEach(function(t){const k=t.date+' '+t.time;if(!groups[k])groups[k]=[];groups[k].push(t.id)});Object.keys(groups).forEach(function(k){if(groups[k].length>1)groups[k].forEach(function(id){ids.push(id)})});return new Set(ids)}
function render(){const c=conflicts(),today=localDate(),items=tasks.filter(t=>filter==='all'||filter==='done'?filter==='all'||t.status==='done':t.type===filter&&t.status!=='done').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('#summary').textContent=`${tasks.filter(t=>t.status!=='done').length} 项待完成 · ${c.size} 项时间冲突`;list.innerHTML=items.length?items.map(t=>`<article class="card ${t.status==='done'?'done':''} ${t.date===today&&t.status!=='done'?'today':''} ${c.has(t.id)?'conflict':''}" data-id="${t.id}"><button class="check" aria-label="${t.status==='done'?'标记未完成':'标记完成'}"></button><button class="open"><div class="row"><span class="name">${esc(t.name)}</span><span class="badge">${esc(t.type)}</span>${t.timeMode==='deadline'?'<span class="badge">截止</span>':''}${t.date===today&&t.status!=='done'?'<span class="today-tag">今日</span>':''}${c.has(t.id)?'<span class="conflict-tag">时间冲突</span>':''}</div><div class="meta"><span>${fmt(t.date)}</span>${t.time?`<span>${esc(t.time)}${t.timeMode==='deadline'?' 前':''}</span>`:''}</div>${t.note?`<div class="note">${esc(t.note)}</div>`:''}</button></article>`).join(''):'<div class="empty">这里还没有任务，点“新建”添加一项。</div>';document.querySelectorAll('.filter').forEach(b=>b.setAttribute('aria-pressed',b.dataset.filter===filter))}
function fmt(d){const [y,m,x]=d.split('-');return `${y}年${Number(m)}月${Number(x)}日`}
function openEdit(t){t=t||null;editing=t?t.id:null;$('#modalTitle').textContent=t?'编辑任务':'新建任务';$('#deleteBtn').style.visibility=t?'visible':'hidden';$('#name').value=t?t.name:'';$('#type').value=t?t.type:'测评';$('#date').value=t?t.date:new Date().toISOString().slice(0,10);$('#time').value=t?t.time:'';$('#timeMode').value=t&&t.timeMode?t.timeMode:'fixed';$('#status').value=t?t.status:'todo';$('#note').value=t?t.note:'';if(typeof editor.showModal==='function')editor.showModal();else{editor.setAttribute('open','');editor.classList.add('fallback')}setTimeout(function(){$('#name').focus()},50)}
function close(){if(typeof editor.close==='function'&&editor.open)editor.close();else{editor.removeAttribute('open');editor.classList.remove('fallback')}editing=null;form.reset()}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
$('#addBtn').onclick=()=>openEdit();$('#closeBtn').onclick=close;$('#cancelBtn').onclick=close;
function updatePreview(){const raw=$('#quickInput').value.trim();if(!raw){$('#parsePreview').innerHTML='<span>输入后自动识别日期、时间和类型</span><span class="quick-help">回车保存</span>';return}const p=parseQuick(raw);$('#parsePreview').innerHTML=`<span class="parse-chip auto">${esc(p.type)}</span><span class="parse-chip">${fmt(p.date)}</span>${p.time?`<span class="parse-chip">${esc(p.time)}</span>`:'<span class="parse-chip">未写时间</span>'}<span class="parse-chip">${p.timeMode==='deadline'?'截止时间':'固定时间'}</span><span class="quick-help">回车保存</span>`}
function quickAdd(){const input=$('#quickInput'),raw=input.value.trim();if(!raw)return;const p=parseQuick(raw);tasks.push({id:Date.now(),...p});input.value='';updatePreview();save();toast('已自动识别并保存')}
$('#quickInput').addEventListener('input',updatePreview);$('#quickInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();quickAdd()}});$('#quickAdd').onclick=quickAdd;
$('#filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}};
list.onclick=e=>{const card=e.target.closest('[data-id]');if(!card)return;const t=tasks.find(x=>x.id===Number(card.dataset.id));if(e.target.closest('.check')){t.status=t.status==='done'?'todo':'done';save()}else openEdit(t)};
form.onsubmit=e=>{e.preventDefault();const data={name:$('#name').value.trim(),type:$('#type').value,date:$('#date').value,time:$('#time').value,timeMode:$('#timeMode').value,status:$('#status').value,note:$('#note').value.trim()};if(editing){Object.assign(tasks.find(t=>t.id===editing),data)}else tasks.push({id:Date.now(),...data});save();close();toast('已保存')};
$('#deleteBtn').onclick=()=>{if(editing&&confirm('确定删除这项任务吗？')){tasks=tasks.filter(t=>t.id!==editing);save();close();toast('已删除')}};
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({name:'秋招备忘录',version:2,exportedAt:new Date().toISOString(),tasks},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`秋招备忘录-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('备份已导出')};
$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text()),arr=Array.isArray(data)?data:data.tasks;if(!Array.isArray(arr))throw 0;if(confirm(`将导入 ${arr.length} 项任务并覆盖当前内容，继续吗？`)){tasks=arr;save();toast('导入成功')}}catch{alert('这个文件不是有效的备忘录备份。')}e.target.value=''};
$('#resetBtn').onclick=()=>{if(confirm('恢复示例任务会覆盖当前内容，确定继续吗？')){tasks=cloneSeed();save();toast('已恢复')}};
editor.addEventListener('click',e=>{if(e.target===editor)close()});render();
</script>
</body></html>
